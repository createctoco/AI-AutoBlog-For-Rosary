{{/* Auto-nofollow all alibaba.com links in article content */}}
<script>
(function () {
  function addNofollowToAlibaba() {
    document.querySelectorAll('a[href*="alibaba.com"]').forEach(function (a) {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'nofollow noopener noreferrer');
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addNofollowToAlibaba);
  } else {
    addNofollowToAlibaba();
  }
})();
</script>
