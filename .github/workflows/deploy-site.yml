name: Deploy Site

# Trigger on push to main when site-related files change
# (does NOT generate new articles — that's the cron workflow's job)
on:
  push:
    branches:
      - main
    paths:
      - 'layouts/**'
      - 'config/**'
      - 'content/**'
      - 'static/**'
      - 'assets/**'
      - 'i18n/**'
      - 'hugo.toml'
      - 'hugo.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-site-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url }}
    env:
      BLOWFISH_COMMIT: e9699d8c5da9a64a105eb8401fd2cf79c6015c6f
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Fetch pinned Blowfish theme (with retry)
        run: |
          for i in 1 2 3; do
            rm -rf themes/blowfish
            mkdir -p themes/blowfish
            git -C themes/blowfish init
            git -C themes/blowfish remote add origin https://github.com/nunocoracao/blowfish.git
            if git -C themes/blowfish fetch --depth 1 origin "$BLOWFISH_COMMIT"; then
              git -C themes/blowfish checkout --detach FETCH_HEAD
              cp layouts/_default/sitemap.xml themes/blowfish/layouts/_default/sitemap.xml || true
              echo "Theme fetched successfully on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, sleeping..."
            sleep $((i * 5))
          done
          echo "Failed to fetch theme after 3 attempts"
          exit 1

      - name: Build Hugo site
        run: hugo --minify --baseURL https://rosarysupply.com/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Sleep before retry 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 10

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Sleep before retry 3
        if: steps.deploy2.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Verify deployment
        if: always()
        run: |
          if [ "${{ steps.deploy1.outcome }}" = "success" ] || [ "${{ steps.deploy2.outcome }}" = "success" ] || [ "${{ steps.deploy3.outcome }}" = "success" ]; then
            echo "Deployment succeeded"
          else
            echo "All 3 deployment attempts failed"
            exit 1
          fi

      - name: Ping search engines
        run: |
          for engine in google bing; do
            for i in 1 2 3; do
              if [ "$engine" = "google" ]; then
                url="https://www.google.com/ping?sitemap=https://rosarysupply.com/sitemap.xml"
              else
                url="https://www.bing.com/ping?sitemap=https://rosarysupply.com/sitemap.xml"
              fi
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
              echo "$engine ping attempt $i: HTTP $code"
              if [ "$code" = "200" ]; then break; fi
              sleep $((i * 5))
            done
          done
