name: Auto Generate Blog Post

on:
  schedule:
    - cron: '0 1 * * *'    # Once daily: UTC 1:00 = Beijing 9:00
  workflow_dispatch:

permissions:
  contents: write

# Never let two generators race to publish different versions of main.
concurrency:
  group: auto-generate-post-main
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BLOWFISH_COMMIT: e9699d8c5da9a64a105eb8401fd2cf79c6015c6f
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run generator safety tests
        run: python -m unittest discover -s tests -v

      - name: Validate existing content
        run: python scripts/validate-site.py

      - name: Generate blog post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/generate-post.py

      - name: Validate generated content
        run: python scripts/validate-site.py

      - name: Fetch pinned Blowfish theme
        run: |
          rm -rf themes/blowfish
          mkdir -p themes/blowfish
          git -C themes/blowfish init
          git -C themes/blowfish remote add origin https://github.com/nunocoracao/blowfish.git
          git -C themes/blowfish fetch --depth 1 origin "$BLOWFISH_COMMIT"
          git -C themes/blowfish checkout --detach FETCH_HEAD
          cp layouts/_default/sitemap.xml themes/blowfish/layouts/_default/sitemap.xml

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.161.0'
          extended: true

      # Build before commit so malformed generated content never enters main.
      - name: Build Hugo site
        run: hugo --minify

      - name: Commit and push validated post
        id: commit_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/

          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Auto generate validated blog post [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$i" -eq 5 ]; then
              echo "Push failed after 5 attempts" >&2
              exit 1
            fi

            echo "Push attempt $i failed; rebasing onto current origin/main"
            git fetch origin main
            git rebase origin/main
            python scripts/validate-site.py
            hugo --minify
            sleep $((i * 5))
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: rosarysupply.com
