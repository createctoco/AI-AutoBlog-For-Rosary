name: Daily Product Recommendation

on:
  schedule:
    - cron: '0 1 * * *'    # Once daily: UTC 1:00 = Beijing 9:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-product-recommendation-main
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url }}
    env:
      BLOWFISH_COMMIT: e9699d8c5da9a64a105eb8401fd2cf79c6015c6f
    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run generator safety tests
        run: python -m unittest discover -s tests -v

      - name: Validate existing content
        run: python scripts/validate-site.py

      - name: Generate product recommendation post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ALIBABA_STORE_URL: ${{ secrets.ALIBABA_STORE_URL }}
        run: python scripts/generate-product-post.py

      - name: Validate generated content
        run: python scripts/validate-site.py

      - name: Fetch pinned Blowfish theme
        run: |
          for i in 1 2 3; do
            rm -rf themes/blowfish
            mkdir -p themes/blowfish
            git -C themes/blowfish init
            git -C themes/blowfish remote add origin https://github.com/nunocoracao/blowfish.git
            if git -C themes/blowfish fetch --depth 1 origin "$BLOWFISH_COMMIT"; then
              git -C themes/blowfish checkout --detach FETCH_HEAD
              cp layouts/_default/sitemap.xml themes/blowfish/layouts/_default/sitemap.xml || true
              echo "Theme fetched successfully on attempt $i"
              exit 0
            fi
            echo "Theme fetch attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done
          echo "::error::Theme fetch failed after 3 attempts" >&2
          exit 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.161.0'
          extended: true

      - name: Build Hugo site
        run: hugo --minify

      - name: Commit and push validated post
        id: commit_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/

          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Auto generate product recommendation post [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$i" -eq 5 ]; then
              echo "Push failed after 5 attempts" >&2
              exit 1
            fi

            echo "Push attempt $i failed; rebasing onto current origin/main"
            git fetch origin main
            git rebase origin/main
            python scripts/validate-site.py
            hugo --minify
            sleep $((i * 5))
          done

      # ---- Deploy with retry (3 attempts) ----
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry 1
        if: steps.deploy1.outcome == 'failure'
        run: echo "Deploy attempt 1 failed, waiting 10s before retry..." && sleep 10

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry 2
        if: steps.deploy2.outcome == 'failure'
        run: echo "Deploy attempt 2 failed, waiting 20s before final retry..." && sleep 20

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Verify deploy result
        if: always()
        run: |
          if [ "${{ steps.deploy1.outcome }}" = "failure" ] && \
             [ "${{ steps.deploy2.outcome }}" = "failure" ] && \
             [ "${{ steps.deploy3.outcome }}" = "failure" ]; then
            echo "::error::All 3 deploy attempts failed"
            exit 1
          fi
          echo "Deploy succeeded"

      # ---- Notify search engines ----
      - name: Ping search engines for sitemap
        run: |
          ping_url() {
            local name="$1" url="$2"
            for i in 1 2 3; do
              local code
              code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$url" 2>/dev/null || echo "000")
              if [ "$code" = "200" ] || [ "$code" = "204" ]; then
                echo "  $name: OK ($code)"
                return 0
              fi
              echo "  $name: attempt $i failed (HTTP $code)"
              [ "$i" -lt 3 ] && sleep $((i * 5))
            done
            echo "  $name: all attempts failed (non-fatal)"
            return 0
          }
          echo "Pinging search engines..."
          ping_url "Google" "https://www.google.com/ping?sitemap=https://rosarysupply.com/sitemap.xml"
          ping_url "Bing" "https://www.bing.com/ping?sitemap=https://rosarysupply.com/sitemap.xml"
